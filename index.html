<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>体素射击核玩工具</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#1b1d22;color:#ddd;font:13px/1.4 "Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif}
#app{display:flex;height:100vh;gap:14px;padding:10px}
#stageWrap{flex:1;display:flex;align-items:center;justify-content:center;min-width:0;position:relative}
#stage{height:calc(100vh - 20px);max-width:100%;aspect-ratio:9/16;background:#000;box-shadow:0 6px 30px rgba(0,0,0,.6);border-radius:6px;cursor:pointer;touch-action:none}
#panel{width:420px;flex:none;display:flex;flex-direction:column;background:#24272e;border-radius:8px;overflow:hidden;box-shadow:0 4px 18px rgba(0,0,0,.4)}
#panelHead{padding:10px 12px;border-bottom:1px solid #333;background:#2b2f37}
#panelHead h1{font-size:15px;margin:0 0 8px;color:#ffd54a}
.btns{display:flex;flex-wrap:wrap;gap:6px}
.btns button{flex:1 1 30%}
button{background:#3a404c;color:#eee;border:1px solid #4b5260;border-radius:5px;padding:6px 8px;cursor:pointer;font:inherit;white-space:nowrap}
button:hover{background:#465060}
button.primary{background:#2e8b47;border-color:#3aa957}
button.on{background:#b33a3a;border-color:#d55}
#status{margin-top:8px;color:#9fd;font-size:12px}
#recInfo{color:#f99;font-size:12px;margin-top:4px}
#recList a{display:block;color:#8cf;font-size:12px;margin-top:3px;word-break:break-all}
#panelBody{overflow-y:auto;flex:1;padding:6px 10px 30px}
details{border:1px solid #353a44;border-radius:6px;margin:8px 0;background:#2a2e36}
summary{cursor:pointer;padding:8px 10px;font-weight:bold;color:#ffd98a;user-select:none}
.row{display:flex;align-items:center;gap:6px;padding:4px 10px}
.row label{flex:0 0 150px;color:#c8ccd4;font-size:12px}
.row input[type=range]{flex:1;min-width:60px}
.row input.val{width:64px;background:#1d2026;color:#fff;border:1px solid #444;border-radius:4px;padding:2px 4px}
.row input[type=text],.row input[type=number]:not(.val),.row select,.row textarea{flex:1;min-width:0;background:#1d2026;color:#fff;border:1px solid #444;border-radius:4px;padding:3px 5px;font:inherit}
.row input[type=color]{width:46px;height:24px;border:none;background:none;padding:0}
.row input[type=file]{flex:1;min-width:0;font-size:11px}
.row button{padding:3px 8px}
.handprev{align-items:flex-start}
#handPrev{border-radius:4px;cursor:crosshair;width:150px;height:190px}
#toast{position:absolute;top:18px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#fff;padding:8px 16px;border-radius:20px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:9}
#toast.show{opacity:1}
#migrateBanner{position:fixed;left:50%;top:10px;transform:translateX(-50%);z-index:50;max-width:min(860px,94vw);background:#fff8e1;color:#4a3000;border:1px solid #e0b84a;border-radius:10px;padding:10px 14px;font-size:13px;line-height:1.6;box-shadow:0 6px 24px rgba(0,0,0,.35)}
#migrateBanner button{margin-left:8px;padding:3px 10px;border-radius:6px;border:1px solid #c79a2a;background:#ffe69a;cursor:pointer}
#migrateBanner button#mbReset{background:#4caf50;color:#fff;border-color:#2e7d32}

.row.t-switch label{flex:1}
.switch{position:relative;display:inline-block;width:46px;height:28px;flex:none;cursor:pointer}
.switch .switch-input{opacity:0;width:0;height:0;position:absolute}
.switch .slider{position:absolute;inset:0;background:#555;border-radius:28px;transition:background .2s}
.switch .slider:before{content:"";position:absolute;width:22px;height:22px;left:3px;top:3px;background:#fff;border-radius:50%;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.35)}
.switch .switch-input:checked+.slider{background:#34c759}
.switch .switch-input:checked+.slider:before{transform:translateX(18px)}
.switch .switch-input:focus-visible+.slider{outline:2px solid #8cf;outline-offset:2px}
.row.dimmed{opacity:.45;pointer-events:none}
.tip{font-size:11px;color:#888;padding:6px 10px}
</style>

<style id="unified-panel-css">
:root,#panel{--p-ink:#e8f0d8;--p-panel-bg:linear-gradient(#2a3320,#1c2416);--p-border:#8a9a40;--p-shadow:#0e140a;--p-title-bg:linear-gradient(#6a7a30,#3a4a18);--p-title:#e8f6a0;--p-title-shadow:#1a2208;--p-title-small:#c8d680;--p-card:#242c1c;--p-card-border:#5a6a30;--p-card-title:#d4e080;--p-btn:linear-gradient(#6a7a30,#3a4a18);--p-btn-border:#1a2208;--p-btn-color:#f4ffc8;--p-primary:linear-gradient(#7ee063,#3fa83a);--p-primary-border:#256d24;--p-blue:linear-gradient(#6db8ff,#3a7fd6);--p-blue-border:#245a9c;--p-orange:linear-gradient(#ffc36b,#e8861f);--p-orange-border:#9a5310;--p-ghost:linear-gradient(#3a4a28,#2a3320);--p-ghost-color:#e8f0d8;--p-ghost-border:#6a7a40;--p-on:linear-gradient(#ff8080,#d63a3a);--p-on-border:#8f2222;--p-status:#1c2416;--p-status-border:#5a6a30;--p-status-color:#d4e080;--p-tools:#2a3320;--p-tools-border:#5a6a30;--p-input:#1a2214;--p-input-border:#6a7a40;--p-input-color:#e8f0d8;--p-cat:linear-gradient(90deg,#3a4a18,#8a9a40 70%,transparent);--p-details-border:#5a6a30;--p-details:#242c1c;--p-details-open:#8a9a40;--p-summary:linear-gradient(#3a4a28,#2a3320);--p-summary-color:#e8f6a0;--p-icon:#1c2416;--p-icon-border:#8a9a40;--p-count:#d4e080;--p-label:#c8d6a8;--p-odd:rgba(138,154,64,.08);--p-range:linear-gradient(#3a4a28,#2a3320);--p-range-border:#6a7a40;--p-thumb:radial-gradient(circle at 35% 35%,#e8f6a0,#6a7a30);--p-thumb-border:#8a9a40;--p-switch:#3a4a28;--p-switch-border:#6a7a40;--p-tip:#1c2416;--p-tip-color:#a8b880;--p-tip-border:#5a6a30;--p-rec:#ffb0a0;--p-scroll:#6a7a40;--p-accent:#c8d64a}
html,body{background:linear-gradient(160deg,#1a2214 0%,#3a4a28 50%,#6a7a40 100%) fixed;color:var(--p-ink)}
#panel{width:430px;flex:none;display:flex;flex-direction:column;background:var(--p-panel-bg);border:5px solid var(--p-border);border-radius:22px;overflow:hidden;box-shadow:0 8px 0 var(--p-shadow),0 16px 40px rgba(0,0,0,.35);color:var(--p-ink)}
#panelHead{padding:0 0 8px;background:transparent;border-bottom:4px solid var(--p-border)}
#panelHead h1{margin:0;padding:9px 14px;font-size:20px;font-weight:800;color:var(--p-title);letter-spacing:1px;background:var(--p-title-bg);border-bottom:4px solid var(--p-border);text-shadow:0 2px 0 var(--p-title-shadow);display:flex;align-items:center;gap:8px}
#panelHead h1 small,#panelHead h1 #ver{font-size:12px;font-weight:700;letter-spacing:0;color:var(--p-title-small);text-shadow:none;margin-left:auto;background:transparent;padding:0}
#panelHead h1 #ver{background:rgba(255,255,255,.18);border-radius:12px;padding:1px 8px}
.pcard{margin:6px 10px 0;padding:5px 7px 7px;background:var(--p-card);border:3px solid var(--p-card-border);border-radius:14px}
.pcard .ptitle{font-size:12px;font-weight:800;color:var(--p-card-title);margin:0 0 5px 2px;display:flex;align-items:center;gap:5px}
#panel .btns, .btns{display:flex;flex-wrap:wrap;gap:6px}
#panel .btns button, .btns button{flex:1 1 30%}
.pcard.slim .btns{align-items:center}.pcard.slim button{flex:1 1 0;min-width:0;font-size:12px;padding:2px 6px;border-bottom-width:4px;border-radius:10px}
#panel button, button{font:inherit;font-weight:800;color:var(--p-btn-color);background:var(--p-btn);border:3px solid var(--p-btn-border);border-bottom-width:5px;border-radius:12px;padding:5px 9px;cursor:pointer;white-space:nowrap;text-shadow:0 1px 0 rgba(0,0,0,.25);box-shadow:none}
#panel button:hover, button:hover{filter:brightness(1.08)}
#panel button:active, button:active{transform:translateY(2px);border-bottom-width:3px}
#panel button.primary, button.primary{background:var(--p-primary);border-color:var(--p-primary-border);color:#fff}
#panel button.big, button.big{font-size:15px;padding:7px 10px}
#panel button.blue, button.blue{background:var(--p-blue);border-color:var(--p-blue-border);color:#fff}
#panel button.orange, button.orange{background:var(--p-orange);border-color:var(--p-orange-border);color:#fff}
#panel button.ghost, button.ghost{background:var(--p-ghost);color:var(--p-ghost-color);text-shadow:none;border-color:var(--p-ghost-border)}
#panel button.on, button.on{background:var(--p-on);border-color:var(--p-on-border);color:#fff}
#levelSel,.pselect,#panel select#levelSel{flex:1 1 40%;min-width:0;font:inherit;font-weight:800;font-size:14px;color:var(--p-input-color);background:#fff;border:3px solid var(--p-border);border-radius:12px;padding:5px 8px;cursor:pointer}
#status{margin:6px 10px 0;padding:5px 10px;border-radius:12px;background:var(--p-status);border:2px solid var(--p-status-border);color:var(--p-status-color);font-size:12px;font-weight:700}
#recInfo{margin:4px 12px 0;color:var(--p-rec);font-size:12px;font-weight:700}
#recInfo:empty{display:none}
#recList{margin:0 10px}
#recList a{display:block;color:var(--p-status-color);font-size:12px;font-weight:700;margin-top:3px;word-break:break-all;background:var(--p-card);border:2px dashed var(--p-status-border);border-radius:10px;padding:3px 8px;text-decoration:none}
#panelTools{display:flex;gap:6px;align-items:center;padding:7px 10px;background:var(--p-tools);border-bottom:3px solid var(--p-tools-border)}
#panelTools input{flex:1;min-width:0;font:inherit;font-weight:700;color:var(--p-input-color);background:var(--p-input);border:3px solid var(--p-input-border);border-radius:12px;padding:4px 10px}
#panelTools button{font-size:12px;padding:2px 8px;border-bottom-width:4px;border-radius:10px}
#panelBody{overflow-y:auto;flex:1;padding:4px 10px 30px}
#panelBody::-webkit-scrollbar{width:10px}#panelBody::-webkit-scrollbar-thumb{background:var(--p-scroll);border-radius:10px}
.pcat{margin:12px 2px 2px;font-size:12px;font-weight:800;color:#fff;background:var(--p-cat);padding:3px 10px;border-radius:10px;letter-spacing:1px;text-shadow:0 1px 0 rgba(0,0,0,.3)}
#panel details, details{border:3px solid var(--p-details-border);border-radius:14px;margin:7px 0;background:var(--p-details);overflow:hidden;box-shadow:none}
#panel details[open], details[open]{border-color:var(--p-details-open);box-shadow:0 3px 0 color-mix(in srgb, var(--p-details-open) 35%, transparent)}
#panel summary, summary{cursor:pointer;padding:7px 10px;font-weight:800;font-size:14px;color:var(--p-summary-color);user-select:none;list-style:none;display:flex;align-items:center;gap:8px;background:var(--p-summary);border-radius:0}
#panel summary::-webkit-details-marker, summary::-webkit-details-marker{display:none}
summary .gi, summary .ico{width:26px;height:26px;flex:none;display:inline-flex;align-items:center;justify-content:center;border-radius:9px;background:var(--p-icon);border:2px solid var(--p-icon-border);font-size:15px;color:inherit;padding:0}
summary .gn, summary .sum-t{flex:1}
summary .gc{font-size:11px;font-weight:800;color:var(--p-count);background:var(--p-icon);border:2px solid var(--p-icon-border);border-radius:10px;padding:0 7px}
summary .chev{display:none}
summary::after{content:"▸";font-size:14px;color:var(--p-count);transition:transform .15s;margin-left:auto}
details[open]>summary::after{transform:rotate(90deg)}
details[open]>summary{border-bottom:2px dashed var(--p-tip-border)}
#panel .row, .row{display:flex;align-items:center;gap:6px;padding:4px 10px}
#panel .row:nth-child(odd), .row:nth-child(odd){background:var(--p-odd)}
#panel .row label, #panel .row>span:first-child, .row label{flex:0 0 150px;color:var(--p-label);font-size:12px;font-weight:700}
#panel .row input[type=range], .row input[type=range]{flex:1;min-width:60px;-webkit-appearance:none;appearance:none;height:10px;border-radius:8px;background:var(--p-range);border:2px solid var(--p-range-border);outline:none;cursor:pointer;accent-color:var(--p-accent)}
#panel .row input[type=range]::-webkit-slider-thumb, .row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--p-thumb);border:3px solid var(--p-thumb-border);box-shadow:0 2px 0 var(--p-shadow)}
#panel .row input.val, .row input.val{width:64px;font:inherit;font-weight:700;background:var(--p-input);color:var(--p-input-color);border:2px solid var(--p-input-border);border-radius:8px;padding:2px 4px}
#panel .row input[type=text],#panel .row input[type=number]:not(.val),#panel .row select,#panel .row textarea,
.row input[type=text],.row input[type=number]:not(.val),.row select,.row textarea{flex:1;min-width:0;background:var(--p-input);color:var(--p-input-color);border:2px solid var(--p-input-border);border-radius:9px;padding:3px 6px;font:inherit;font-weight:700}
#panel .row input[type=checkbox]:not(.switch-input){width:20px;height:20px;accent-color:#3fa83a;cursor:pointer}
#panel .row input[type=color]{width:46px;height:26px;border:2px solid var(--p-border);border-radius:8px;background:var(--p-input);padding:1px;cursor:pointer}
#panel .row input[type=file]{flex:1;min-width:0;font-size:11px;color:var(--p-label)}
#panel .row input[type=file]::file-selector-button{font:inherit;font-weight:800;color:var(--p-ghost-color);background:var(--p-ghost);border:2px solid var(--p-ghost-border);border-radius:9px;padding:2px 8px;cursor:pointer}
#panel .row button{padding:2px 9px;font-size:12px;border-bottom-width:4px;border-radius:10px}
.row.hidden-by-filter,details.hidden-by-filter,.pcat.hidden-by-filter{display:none !important}
.handprev{align-items:flex-start}
#handPrev{border-radius:10px;border:3px solid var(--p-border);cursor:crosshair;width:150px;height:190px}
.row.t-switch label,.row.t-switch>span:first-child{flex:1}
.switch{position:relative;display:inline-block;width:50px;height:28px;flex:none;cursor:pointer}
.switch .switch-input{opacity:0;width:0;height:0;position:absolute}
.switch .slider{position:absolute;inset:0;background:var(--p-switch);border:2px solid var(--p-switch-border);border-radius:28px;transition:background .2s}
.switch .slider:before,.switch .thumb{content:"";position:absolute;width:20px;height:20px;left:2px;top:2px;background:#fff;border-radius:50%;transition:transform .2s;box-shadow:0 2px 0 var(--p-shadow)}
.switch .switch-input:checked+.slider{background:var(--p-primary);border-color:var(--p-primary-border)}
.switch .switch-input:checked+.slider:before,.switch .switch-input:checked+.slider .thumb,.switch .switch-input:checked+.slider+.thumb{transform:translateX(22px)}
.switch .switch-input:focus-visible+.slider{outline:3px solid #ffd02a;outline-offset:2px}
.row.dimmed{opacity:.45;pointer-events:none}
.tip{font-size:11px;color:var(--p-tip-color);padding:6px 10px;background:var(--p-tip);border-top:2px dashed var(--p-tip-border)}
.theme-picker{padding:6px 10px;display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.theme-picker .tp-l{grid-column:1/-1;color:var(--p-label);font-size:12px}
.theme-card{display:flex;flex-direction:column;gap:6px;padding:7px;border-radius:11px;text-align:left;background:var(--p-input);border:2px solid var(--p-input-border);color:var(--p-input-color)}
.theme-card .sw{display:block;height:46px;border-radius:7px}
.theme-card.on{border-color:var(--p-accent);box-shadow:0 0 0 3px color-mix(in srgb, var(--p-accent) 30%, transparent)}
.sec-body{overflow:hidden}
.rec-time{display:inline-block;min-width:5.2ch;text-align:left;font-variant-numeric:tabular-nums}
#levelSel.hidden-level{display:none}
@media(max-width:820px){html,body{height:auto}#app{flex-direction:column;height:auto;padding:6px;gap:12px;min-height:100vh}#stageWrap{flex:none}#stage{height:auto;width:100%;max-height:calc(100vh - 12px)}#panel{width:100%;border-radius:18px}#panelBody{max-height:none;overflow:visible}
  #panel .row,.row{flex-wrap:wrap}#panel .row label,.row label{flex:1 1 100%}#panel .row.t-switch label,#panel .row.t-checkbox label{flex:1 1 0}#panel .btns button,.btns button{flex:1 1 30%;padding:7px 6px}#panelTools{position:sticky;top:0;z-index:2}}

</style>
</head>
<body>
<div id="app">
  <div id="stageWrap"><canvas id="stage" width="720" height="1280"></canvas><div id="toast"></div></div>
    <div id="panel">
    <div id="panelHead">
      <h1>🎯 体素射击 · 控制台 <small>核玩工具</small></h1>
      <div class="pcard">
        <div class="ptitle">🧩 关卡</div>
        <div class="btns"><select id="levelSel" title="选关"></select><button id="btnNew" class="ghost">↻ 重新开始</button><button id="btnSeed" class="ghost">🎲 换一局</button></div>
      </div>
      <div class="pcard">
        <div class="ptitle">🎬 演示 · 录制 · 截图</div>
        <div class="btns"><button id="btnAuto" class="primary big">▶ 自动通关</button><button id="btnRec" class="big">⏺ 开始录制</button><button id="btnShot" class="blue big">📷 截图</button></div>
      </div>
      <div class="pcard slim">
        <div class="btns"><span class="ptitle" style="margin:0 2px 0 0">💾 设置</span><button id="btnExport" class="ghost">⬇ 导出设置</button><button id="btnImport" class="ghost">⬆ 导入设置</button><button id="btnReset" class="ghost">⟲ 恢复默认</button></div>
      </div>
      <input type="file" id="importFile" accept=".json,application/json" hidden>
      <div id="status"></div>
      <div id="recInfo"></div>
      <div id="recList"></div>
    </div>
    <div id="panelTools"><input id="panelSearch" type="search" placeholder="🔍 搜索设置（如 亮度、手指、H5）"><button id="btnExpandAll" class="ghost">全部展开</button><button id="btnCollapseAll" class="ghost">全部收起</button></div>
    <div id="panelBody"></div>

def first_image(mat):
    if not mat.use_nodes:

INFO = {}
def info(mat):

    return INFO[mat.name]
def principled(mat):
    """FBX \u7528\uFF1APrincipled BSDF\uFF08\u5E95\u8272=\u8D34\u56FE\xD7\u989C\u8272\uFF0C\u81EA\u53D1\u5149=\u540C\u4E00\u8D34\u56FE\uFF0CAlpha=\u8D34\u56FE Alpha\xD7\u4E0D\u900F\u660E\u5EA6\uFF09\uFF0CFBX \u5BFC\u51FA\u5668\u53EA\u8BA4\u8FD9\u79CD\u7ED3\u6784"""
    fac, mode, cutoff, img = info(mat)
    mat.use_nodes = True
    nt = mat.node_tree; nt.nodes.clear(); N, L = nt.nodes, nt.links
    out = N.new("ShaderNodeOutputMaterial"); out.location = (600, 0)
    b = N.new("ShaderNodeBsdfPrincipled"); b.location = (250, 0)
    b.inputs["Base Color"].default_value = (fac[0], fac[1], fac[2], 1)
    b.inputs["Alpha"].default_value = fac[3]
    b.inputs["Roughness"].default_value = 1.0
    b.inputs["Emission Strength"].default_value = 1.0
    b.inputs["Emission Color"].default_value = (fac[0], fac[1], fac[2], 1)
    if img:
        tex = N.new("ShaderNodeTexImage"); tex.image = img; tex.location = (-200, 0)
        L.new(tex.outputs[0], b.inputs["Base Color"]); L.new(tex.outputs[0], b.inputs["Emission Color"])
        if mode != "OPAQUE":
            L.new(tex.outputs[1], b.inputs["Alpha"])
    L.new(b.outputs[0], out.inputs[0])
def rebuild(mat):
    fac, mode, cutoff, img = info(mat)
    mat.use_nodes = True
    nt = mat.node_tree; nt.nodes.clear(); N, L = nt.nodes, nt.links
    out = N.new("ShaderNodeOutputMaterial"); out.location = (900, 0)
    em = N.new("ShaderNodeEmission"); em.location = (500, 100)
    tr = N.new("ShaderNodeBsdfTransparent"); tr.location = (500, -100)
    mix = N.new("ShaderNodeMixShader"); mix.location = (700, 0)
    col = N.new("ShaderNodeRGB"); col.location = (-200, 200); col.outputs[0].default_value = (fac[0], fac[1], fac[2], 1)
    col.label = "baseColorFactor"
    mul = N.new("ShaderNodeMix"); mul.data_type = "RGBA"; mul.blend_type = "MULTIPLY"; mul.location = (100, 150)
    mul.inputs[0].default_value = 1.0
    L.new(col.outputs[0], mul.inputs[6])
    alpha_val = N.new("ShaderNodeValue"); alpha_val.name = alpha_val.label = "Opacity"; alpha_val.location = (-200, -250)
    alpha_val.outputs[0].default_value = fac[3]
    alpha = alpha_val.outputs[0]
    if img:
        tex = N.new("ShaderNodeTexImage"); tex.image = img; tex.location = (-450, 50); tex.interpolation = "Linear"
        tex.extension = "CLIP"
        L.new(tex.outputs[0], mul.inputs[7])
        am = N.new("ShaderNodeMath"); am.operation = "MULTIPLY"; am.location = (100, -200)
        L.new(tex.outputs[1], am.inputs[0]); L.new(alpha_val.outputs[0], am.inputs[1]); alpha = am.outputs[0]
        if mat.name.startswith("mat_end"):  # \u7ED3\u675F\u9875\u538B\u6697\u5C42\uFF1A\u7F51\u9875\u5728 sRGB \u7A7A\u95F4\u6DF7\u5408 \u2192 \u7EBF\u6027\u7A7A\u95F4\u7B49\u6548 alpha' = 1-(1-a)^2.2
            s1 = N.new("ShaderNodeMath"); s1.operation = "SUBTRACT"; s1.inputs[0].default_value = 1.0; L.new(alpha, s1.inputs[1])
            pw = N.new("ShaderNodeMath"); pw.operation = "POWER"; L.new(s1.outputs[0], pw.inputs[0]); pw.inputs[1].default_value = 2.2
            s2 = N.new("ShaderNodeMath"); s2.operation = "SUBTRACT"; s2.inputs[0].default_value = 1.0; L.new(pw.outputs[0], s2.inputs[1]); alpha = s2.outputs[0]
    else:
        mul.inputs[7].default_value = (1, 1, 1, 1)
    c = mul.outputs[2]
    if False:  # \u724C\u8EAB\u7528\u9876\u70B9\u8272\uFF08\u767D\u2192\u7070\u2192\u7EFF \u6E10\u53D8\uFF09
        vc = N.new("ShaderNodeVertexColor"); vc.location = (100, 400)
        m2 = N.new("ShaderNodeMix"); m2.data_type = "RGBA"; m2.blend_type = "MULTIPLY"; m2.location = (300, 250); m2.inputs[0].default_value = 1
        L.new(c, m2.inputs[6]); L.new(vc.outputs[0], m2.inputs[7]); c = m2.outputs[2]
    L.new(c, em.inputs[0]); em.inputs[1].default_value = 1.0
    if mode == "MASK":
        st = N.new("ShaderNodeMath"); st.operation = "GREATER_THAN"; st.inputs[1].default_value = cutoff - 1e-4; st.location = (300, -250)
        L.new(alpha, st.inputs[0]); alpha = st.outputs[0]
    if mode == "OPAQUE":
        L.new(em.outputs[0], out.inputs[0])
    else:
        L.new(alpha, mix.inputs[0]); L.new(tr.outputs[0], mix.inputs[1]); L.new(em.outputs[0], mix.inputs[2]); L.new(mix.outputs[0], out.inputs[0])
    try:
        mat.surface_render_method = "BLENDED" if mode == "BLEND" else "DITHERED"
    except Exception:
        mat.blend_method = "BLEND" if mode == "BLEND" else ("CLIP" if mode == "MASK" else "OPAQUE")
    return alpha_val

report = {"objects": len(bpy.data.objects), "meshes": sum(1 for o in bpy.data.objects if o.type == "MESH"),
          "empties": sum(1 for o in bpy.data.objects if o.type == "EMPTY"), "cameras": sum(1 for o in bpy.data.objects if o.type == "CAMERA"),
          "actions": len(bpy.data.actions), "fcurves": sum(len(a.fcurves) for a in bpy.data.actions),

          "shooters": sum(1 for o in bpy.data.objects if re.match(r"^shooter_\\d+$", o.name)),
          "numbers": sum(1 for o in bpy.data.objects if re.match(r"^shooter_\\d+_num_\\d+$", o.name)),

MATS = [m for m in bpy.data.materials if m.users and (m.name.startswith("mat_") or not LI)]  # v1.2\uFF1A\u53EA\u628A 2D \u53E0\u52A0\u5C42\uFF08mat_*\uFF09\u6539\u4E3A\u81EA\u53D1\u5149\uFF1B3D \u6A21\u578B\uFF08pbr_*\uFF09\u4FDD\u7559 PBR
for m in MATS:

# Blender \u5185\u6E32\u67D3\u7528\uFF1A\u81EA\u53D1\u5149 + \u900F\u660E\u6750\u8D28\uFF08FBX \u5DF2\u5BFC\u51FA\uFF0C\u4E0D\u53D7\u5F71\u54CD\uFF09

        out = N.new("ShaderNodeOutputMaterial"); geo = N.new("ShaderNodeNewGeometry"); mix = N.new("ShaderNodeMixShader")

        lp = N.new("ShaderNodeLightPath"); mul = N.new("ShaderNodeMath"); mul.operation = "MULTIPLY"  # \u53EA\u5BF9\u76F8\u673A\u5149\u7EBF\u663E\u793A\uFF08\u9634\u5F71 / \u53CD\u5C04\u5149\u7EBF\u7A7F\u8FC7\uFF09
        Lk.new(geo.outputs["Backfacing"], mul.inputs[0]); Lk.new(lp.outputs["Is Camera Ray"], mul.inputs[1]); Lk.new(mul.outputs[0], mix.inputs[0]); Lk.new(tr.outputs[0], mix.inputs[1]); Lk.new(em.outputs[0], mix.inputs[2]); Lk.new(mix.outputs[0], out.inputs[0])

        p = p.parent

    ad = p.animation_data
